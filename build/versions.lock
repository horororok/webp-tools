# build/versions.lock
#
# `build/versions.env`의 핀 박은 업스트림 버전들로 빌드했을 때 나온 산출물 SHA-256.
# 재빌드 후 값이 바뀌면 (a) 업스트림 태르볼이 바뀐 것 (b) 빌드 환경이 결정적이지
# 않은 것 (c) emsdk/툴체인 업데이트가 반영된 것 — 중 하나. 의도된 변경이면 이 파일
# 같이 업데이트하고, 아니면 원인을 찾아야 한다.
#
# 비교:  shasum -a 256 packages/gif2webp/wasm/gif2webp.mjs

[gif2webp @ emsdk=3.1.74 libwebp=1.6.0 giflib=5.2.2 platform=linux/amd64 env=web,worker single_file=1 threads=off patches=gif2webp]
gif2webp.mjs = 9a0d5d54aeae61e74f4532369a2a80a636be716f47e0688c78a2b825af99857f
# wasm은 SINGLE_FILE=1로 mjs에 인라인됨 — 별도 파일 없음.

# 비교:  shasum -a 256 packages/img2webp/wasm/img2webp.mjs
[img2webp @ emsdk=3.1.74 libwebp=1.6.0 zlib=1.3.1 libpng=1.6.44 libjpeg-turbo=3.0.4 platform=linux/amd64 env=web,worker single_file=1 threads=off]
img2webp.mjs = dd2359dfe46060481f4d885e9ebecd782aa654a8dd8b9953aeb0c3769c3c384f
# wasm은 SINGLE_FILE=1로 mjs에 인라인됨 — 별도 파일 없음.
