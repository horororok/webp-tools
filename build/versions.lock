# build/versions.lock
#
# `build/versions.env`의 핀 박은 업스트림 버전들로 빌드했을 때 나온 산출물 SHA-256.
# 재빌드 후 값이 바뀌면 (a) 업스트림 태르볼이 바뀐 것 (b) 빌드 환경이 결정적이지
# 않은 것 (c) emsdk/툴체인 업데이트가 반영된 것 — 중 하나. 의도된 변경이면 이 파일
# 같이 업데이트하고, 아니면 원인을 찾아야 한다.
#
# 비교:  shasum -a 256 packages/gif2webp/wasm/gif2webp.mjs

[gif2webp @ emsdk=3.1.74 libwebp=1.6.0 giflib=5.2.2 platform=linux/amd64 env=web,worker single_file=1 threads=off patches=gif2webp runtime=callMain,FS,stackSave,stackRestore]
gif2webp.mjs = 64046ccf6f17cd88bce1d35f74ca4a02590f1140afc7e0f944015ee7264dbedc
# wasm은 SINGLE_FILE=1로 mjs에 인라인됨 — 별도 파일 없음.

# 비교:  shasum -a 256 packages/img2webp/wasm/img2webp.mjs
[img2webp @ emsdk=3.1.74 libwebp=1.6.0 zlib=1.3.1 libpng=1.6.44 libjpeg-turbo=3.0.4 platform=linux/amd64 env=web,worker single_file=1 threads=off runtime=callMain,FS,stackSave,stackRestore]
img2webp.mjs = 249d6892fa608bf5cbb2a0f4183e2935311a2f30c5865642ddd5b37475156c32
# wasm은 SINGLE_FILE=1로 mjs에 인라인됨 — 별도 파일 없음.
